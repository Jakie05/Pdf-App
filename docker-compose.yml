services:

  postgres:
    image: postgres:16
    container_name: devprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - devprep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: devprep-backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devprep-network

  frontend:
    build:
      context: ./frontend
    container_name: devprep-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devprep-network

volumes:
  postgres_data:

networks:
  devprep-network:
    driver: bridge

